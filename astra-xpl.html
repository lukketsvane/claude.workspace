<!doctype html><meta charset="utf-8"><title>Astra bridge</title><style>body{font-family:system-ui;max-width:760px;margin:40px auto;padding:0 16px}input,textarea,button{font:inherit;width:100%;box-sizing:border-box;margin:8px 0;padding:10px}textarea{min-height:280px}pre{white-space:pre-wrap;border:1px solid #ddd;padding:12px}</style><h1>Astra bridge</h1><input id="email" type="email" placeholder="email"><button id="signup">Create / connect Experiential</button><button id="test">Test GPT-6 Astra</button><textarea id="prompt" placeholder="Prompt"></textarea><button id="send">Send to GPT-6 Astra</button><pre id="out"></pre><script>
const out=document.getElementById('out');
async function api(body){const r=await fetch('/api/xpl-proxy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(JSON.stringify(j));return j}
signup.onclick=async()=>{try{out.textContent='signing up…';const j=await api({action:'signup',email:email.value});if(j.api_key)localStorage.setItem('xpl_key',j.api_key);out.textContent=JSON.stringify({ok:j.ok,credits_granted:j.credits_granted,verification_required:j.verification_required,overview_url:j.overview_url},null,2)}catch(e){out.textContent=String(e)}};
test.onclick=async()=>{try{out.textContent='testing…';const j=await api({action:'call',key:localStorage.getItem('xpl_key'),prompt:'Reply with exactly ASTRA_OK and nothing else.'});out.textContent=JSON.stringify({ok:j.ok,model:j.model,text:j.text,usage:j.usage},null,2)}catch(e){out.textContent=String(e)}};
send.onclick=async()=>{try{out.textContent='running…';const j=await api({action:'call',key:localStorage.getItem('xpl_key'),prompt:prompt.value});out.textContent='MODEL: '+j.model+'\n\n'+j.text+'\n\nUSAGE: '+JSON.stringify(j.usage)}catch(e){out.textContent=String(e)}};
</script>
