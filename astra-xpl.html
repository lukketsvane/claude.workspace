<!doctype html><meta charset="utf-8"><title>Astra bridge</title><style>body{font-family:system-ui;max-width:760px;margin:40px auto;padding:0 16px}button,textarea{font:inherit;width:100%;box-sizing:border-box;margin:8px 0;padding:10px}textarea{min-height:320px}pre{white-space:pre-wrap;border:1px solid #ddd;padding:12px}</style><script src="https://js.puter.com/v2/"></script><h1>Astra bridge</h1><button id="test">Create temp user + test GPT-6 Astra</button><textarea id="prompt" placeholder="Prompt"></textarea><button id="send">Send prompt to GPT-6 Astra</button><pre id="out"></pre><script>
const out=document.getElementById('out');
async function ensureTemp(){ if(!puter.auth.isSignedIn()) await puter.auth.signIn({attempt_temp_user_creation:true}); return await puter.auth.getUser(); }
async function run(p){ const u=await ensureTemp(); const r=await puter.ai.chat(p,{model:'openai/gpt-6-astra'}); const text=r?.message?.content ?? r?.message ?? r?.text ?? String(r); out.textContent='USER_TEMP: '+!!u?.is_temp+'\nMODEL_REQUESTED: openai/gpt-6-astra\n\n'+text; }
test.onclick=async()=>{try{out.textContent='testing…';await run('Reply with exactly ASTRA_OK and nothing else.')}catch(e){out.textContent='ERROR: '+(e?.msg||e?.message||String(e))}};
send.onclick=async()=>{try{out.textContent='running…';await run(prompt.value)}catch(e){out.textContent='ERROR: '+(e?.msg||e?.message||String(e))}};
</script>
