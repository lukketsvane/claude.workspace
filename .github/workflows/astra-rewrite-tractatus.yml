name: Astra Rewrite Tractatus
on:
  push:
    paths:
      - '.github/workflows/astra-rewrite-tractatus.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  copilot-requests: write
jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Fetch self-contained Astra v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -L \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/lukketsvane/claude.workspace/actions/artifacts/10017779234/zip \
            -o v3.zip
          unzip -j v3.zip -d extracted
          cp extracted/astra-tractatus.tex source.tex
      - name: Build adversarial repair prompt
        run: |
          cat > prompt.txt <<'PROMPT'
          Du er siste logiske kontrollør av ein traktat som skal fungere som eit sjølvberande fundament for form- og designteori. Kjeldeteksten er allereie skriven av GPT-6 Astra og er fri for importert matematisk formalisme. No skal du IKKJE pynte han. Du skal prøve å øydeleggje argumentet, finne kvar det ikkje held, og deretter skrive HEILE traktaten på nytt slik at svakheitene er borte.

          AMBISJON
          Teksten skal ha same kjensla av nødvendighet, kompresjon og arkitektonisk samanheng som Tractatus Logico-Philosophicus, utan pastisj. Kvar proposisjon skal stå fordi akkurat denne proposisjonen må kome her. Nummereringa skal vere eit avhengnadstre, ikkje dekorasjon.

          ABSOLUTTE KRAV
          1. Verket skal vere fullstendig i seg sjølv. Ingen usynleg matematikk, logikk, systemteori, designteori eller filosofi får vere nødvendig for å forstå det.
          2. Ingen importert formalisme: ingen likningar, symbolsk logikk, variablar, mengdelære, topologi, sannsynsnotasjon, optimaliseringsapparat, informasjonsmål eller liknande. Nummereringa og d/a/t/o/i er det einaste gjevne formelle apparatet.
          3. Eit teorem må FØLGJE frå eksplisitte tidlegare premiss. Plausibilitet, erfaring, vane eller eit godt døme er ikkje deduksjon. Omklassifiser til postulat eller observasjon, legg inn nødvendige premiss, eller fjern påstanden.
          4. Eit postulat må vere synleg som eit postulat. Ikkje smugle empiriske generaliseringar inn som teorem.
          5. Ein definisjon må berre fastsetje bruk; han får ikkje late som han beviser at det definerte fenomenet finst.
          6. Færre primitive omgrep er betre. Fjern kvart omgrep som ikkje er nødvendig for resten av systemet.
          7. Ikkje overlov. Teorien skal vise grensene sine like presist som innhaldet sitt.

          SÆRLEG MISTENKJELEGE STADER I KJELDETEKSTEN
          Desse er døme på typar feil du MÅ kontrollere i heile teksten, ikkje ei uttømmande liste:
          - Ein mekanisk dobbel/øydelagd proposisjon kring 1.4 må reparerast.
          - Påstanden om at uavhengig konvergens åleine gjer ein busett posisjon «reell, ikkje berre vane» kan vere for sterk.
          - Dersom moglegheitsfeltet allereie er gjeve av objekta sin natur, må teksten ikkje samstundes seie at grensa for kva dei same objekta kan gjere flyttar seg berre fordi me forstår dei annleis, utan å forklare kva som faktisk endrar seg.
          - «Om berre eitt trykk verka, ville alle realiserte konfigurasjonar vere identiske» følgjer ikkje utan eit ekstra premiss. Reparer eller fjern.
          - «Fleire motstridande trykk inneber at kvar realisert konfigurasjon er eit kompromiss og tilfredsstiller ingen fullt ut» er ikkje nødvendig sant. Reparer eller fjern.
          - Ord som landskap, haug, dal, trykk, tyngd og sannsyn må anten vere presist definerte i vanleg språk eller erstattast av enklare omgrep. Metaforen må aldri gjere logisk arbeid på eiga hand.
          - Spør om omgrepa agent, liv, død, affordans, stilart, kompetanse, omhug, rekkevidd og svikttid verkeleg er primitive delar av fundamentet, eller om nokre av dei er unødvendige utvidingar. Fjern det teorien kan klare seg utan.
          - Pass på at forklaring av form ikkje blir blanda saman med prediksjon. Ein teori kan forklare utan alltid å kunne føreseie eit einskild utfall.
          - Pass på at forklaring, vurdering og mynde held fram som tre ulike kategoriar. Ingen normativ plikt får utleiast frå geometri eller kausal forklaring.
          - «Ansvar», «skade» og «mynde» må anten få ei streng plassering eller stå tydeleg ved grensa for det formteorien kan avgjere. Ikkje gjer politisk eller etisk teori til skjult del av geometrien.

          AVHENGNADSTEST FOR KVAR PROPOSISJON
          Før du godtek N+1, spør stille:
          - Kva konkrete tidlegare proposisjonar gjer henne nødvendig?
          - Er alle omgrepa hennar alt etablerte?
          - Er klassifikasjonen d/a/t/o/i korrekt?
          - Dersom ho er eit teorem: kan konklusjonen vere falsk medan alle tidlegare premiss er sanne? Dersom ja, er ho ikkje eit teorem.
          - Dersom ho er observasjon: er det tydeleg at observasjonen ikkje ber resten av systemet som eit skjult aksiom?
          - Dersom ho introduserer eit nytt hovudomgrep: er det umogleg å gjere same arbeid med omgrep som alt finst?
          Reparér før du går vidare.

          HIERARKI
          - 1, 2, 3 ... er nødvendige hovudledd.
          - 1.1 utfaldar eller støttar 1; 1.11 utfaldar eller støttar 1.1; osv.
          - Sysken må vere på same logiske nivå.
          - Dersom ein proposisjon ikkje er eit barn av forelderen sin, flytt eller nummerer han på nytt.
          - Unngå djup nummerering utan reell avhengnad.
          - I LaTeX-kjelda: TO ASCII-MELLOMROM per hierarkinivå framfor kvar \prop-linje. \mainprop står utan innrykk.

          STRESSTEST MOT DESIGNTEORIENS DELFUNDAMENT
          Ikkje nemn teoriane eller forfattarane i endeleg tekst. Men traktaten skal med SITT EIGE SPRÅK kunne plassere dei sentrale problema dei kvar for seg prøvde å løyse: generering av nye moglegheiter; transformasjon og gjenkjenning av form; krav og avgrensingar; føremål, verknad, struktur og materiale; reformulering under arbeid; taus og handverksmessig kunnskap; historisk vidareføring; meining og handlingsmoglegheit; fleire motstridande omsyn; ansvar og skade; skiljet mellom forklaring, vurdering og institusjonell autoritet.

          «Å plassere» tyder ikkje at alt må utleiast frå same prinsipp. Dersom eit spørsmål ligg utanfor det formteorien kan avgjere, skal traktaten vise NØYAKTIG kvifor og kvar grensa går. Det er sterkare enn å late som teorien kan alt.

          OPERATIV PRØVE
          Etter teksten skal ein designar med berre traktatens eigne omgrep kunne:
          - beskrive kva i ei form som er gjeve og kva som kunne vore annleis;
          - formulere nye formhypotesar ved å endre relasjonar, avgrensingar eller val;
          - samanlikne alternative forklaringar;
          - peike ut kva som manglar i ei forklaring;
          - undersøkje verknaden av materiale, produksjon, bruk, historie og situasjon utan å redusere forma til dei;
          - skilje faktiske påstandar frå vurderingar;
          - vite når traktaten ikkje kan avgjere spørsmålet.

          PARSIMONI-PASS
          Når argumentet held, gjer det ein gong til med færre omgrep og færre proposisjonar. Dersom to proposisjonar kan erstattast av éi utan tap, gjer det. Dersom eit kapittel kan fjernast utan at resten misser forklaringskraft, fjern det. Djupna skal kome frå avhengnaden, ikkje frå mengda tekst.

          SISTE PASS
          Les heile traktaten lineært frå 1 til siste proposisjon med resten skjult. Kvar neste proposisjon må vere forståeleg og rett klassifisert berre frå det som alt er synleg. Kontroller deretter alle parent-child-forhold. Kontroller til slutt at det finst NULL importert matematisk formalisme og NULL kjeldetilvisingar eller namn-dropping.

          OUTPUT
          Gi berre det fullstendige, ferdige traktatmanuskriptet. Ingen analyse, ingen kommentar, ingen føreord, ingen litteraturliste. Presist naturleg nynorsk. Behald berre LaTeX-makroane \mainprop{...}{...}{...}, \prop{...}{...}{...}, \silentchapter/\flowchapter og den eksisterande vesle legenda dersom ho trengst. Lever HEILE teksten.

          KJELDE - ASTRA V3:
          PROMPT
          cat source.tex >> prompt.txt
      - name: Adversarial rewrite with GPT-6 Astra
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_MODEL: gpt-6-astra
          COPILOT_ALLOW_ALL: 'true'
        run: |
          set -o pipefail
          copilot --yolo -p "$(cat prompt.txt)" | tee astra-tractatus.tex
      - name: Upload repaired tractatus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-tractatus
          path: astra-tractatus.tex
          if-no-files-found: error
