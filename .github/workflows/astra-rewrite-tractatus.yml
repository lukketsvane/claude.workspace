name: Astra Rewrite Tractatus
on:
  push:
    paths:
      - '.github/workflows/astra-rewrite-tractatus.yml'
  workflow_dispatch:
permissions:
  contents: read
  copilot-requests: write
jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Fetch current tractatus source
        run: curl -fsSL https://raw.githubusercontent.com/lukketsvane/FORML-RE/main/traktat/src/proposisjonar.tex -o source.tex
      - name: Build rewrite prompt
        run: |
          cat > prompt.txt <<'PROMPT'
          Du er logikar, formteoretikar og filosofisk arkitekt. Skriv HEILE kjeldeteksten nedanfor om til eitt sjølvberande filosofisk verk på presist, naturleg nynorsk.

          Ambisjonen er den same kjensla av nødvendighet, kompresjon, klarleik, rytme og arkitektonisk oppbygging som i Wittgensteins Tractatus Logico-Philosophicus, utan å kopiere formuleringar eller lage pastisj. Målet er ikkje å høyrest wittgensteinsk ut. Målet er at kvar proposisjon skal verke nødvendig, stå på rett stad, og vere eit faktisk ledd i eitt argument.

          ABSOLUTT KRAV: TRAKTATEN SKAL VERE HEIL OG FULLSTENDIG I SEG SJØLV.

          Lesaren skal ikkje måtte kjenne matematikk, logisk notasjon, systemteori, topologi, designmetodar eller andre teoriar for å forstå eller bruke systemet. Ikkje importer formalisme for å låne presisjon eller autoritet. Presisjonen skal skapast av teksten sjølv.

          FORBOD MOT IMPORTERT FORMALISME:
          - Ikkje bruk mengdelære, topologi, symbolsk logikk, algebra, variablar, funksjonsnotasjon, sannsynsnotasjon, likningar, diagramgrammatikk eller andre matematiske apparat med mindre apparatet først blir skapt frå grunnen av i teksten, med eigne primitive omgrep, og er strengt nødvendig.
          - Føretrekk alltid ei presis setning framfor eit symbol.
          - Ikkje bruk matematiske symbol berre fordi kjeldeteksten gjer det. Omset dei til vanleg språk eller fjern dei dersom argumentet ikkje treng dei.
          - Nummereringa av proposisjonane og klassane d/a/t/o/i er det einaste formelle apparatet som er gitt på førehand.
          - Ingen ekstern definisjon får smuglast inn gjennom ord som «rom», «system», «informasjon», «funksjon», «optimal», «topologi», «emergens», «kompleksitet» eller liknande. Dersom eit slikt ord er nødvendig, må meininga bli etablert innanfrå traktaten.

          SJØLVBERANDE SPRÅK:
          Kvar term som gjer reelt arbeid i teorien skal anten:
          1. bli definert i traktaten,
          2. vere eit vanleg ord brukt i sin vanlege tyding, eller
          3. få tydinga tvingande av det som allereie er etablert.
          Ingen proposisjon får krevje eit usynleg pensum.

          DET VIKTIGASTE KRAVET ER INFERENSIELL KONTINUITET.

          Ikkje skriv ei samling gode aforismar. Skriv ei kjede der kvar proposisjon NATURLEG FØLGJER frå det som alt er etablert. Før du godtek kvar ny proposisjon, still stille testen: «Kva i dei føregåande proposisjonane gjer akkurat denne proposisjonen nødvendig no?» Dersom svaret ikkje er presist, må du flytte henne, skrive inn det manglande mellomleddet, omklassifisere henne eller fjerne henne.

          Ingen tankesprang. Ingen ny term, distinksjon, kausal påstand eller ontologisk føresetnad får dukke opp berre fordi han blir nyttig seinare. Alt må vere førebudd. Ein lesar skal kunne gå frå proposisjon N til N+1 utan å gjette kva som manglar.

          Gjer ein intern proof-pass før endeleg output:
          1. Bygg eit avhengnadskart for alle proposisjonane.
          2. Finn manglande premiss, nye primitive omgrep, nivåhopp og proposisjonar som berre står tematisk nær kvarandre.
          3. Reparer kjeda med færre og sterkare proposisjonar og nødvendige mellomledd.
          4. Sorter argumentet slik at ingenting kjem før føresetnadene sine.
          5. Les HEILE traktaten lineært og krev at overgangen frå kvar proposisjon til den neste kjennest uunngåeleg.
          Ikkje vis dette arbeidet.

          HIERARKIET ER LOGIKK, IKKJE DEKORASJON.
          - 1, 2, 3 ... er grunnledd som ber kvar sin nødvendig hovuddel av systemet.
          - 1.1 er direkte utfalding, føresetnad eller konsekvens av 1.
          - 1.11 er direkte utfalding, føresetnad eller konsekvens av 1.1.
          - 1.111 er tilsvarande underordna 1.11.
          - Ein underproposisjon må kunne lesast som svar på «kva inneber forelderen?» eller «kvifor følgjer forelderen?».
          - Syskenproposisjonar skal ha same logiske nivå og naturleg intern rekkjefølgje.
          - Dersom 1.12 eigentleg ikkje høyrer under 1.1, skal ho IKKJE få nummeret 1.12. Flytt eller nummerer på nytt.
          - Ikkje bruk djup nummerering for å etterlikne Tractatus. Bruk henne berre når avhengnaden faktisk er djup.

          VISUELL HIERARKI:
          Hovudproposisjonar er nivå 0; .1 nivå 1; .11 nivå 2; .111 nivå 3 osv. I LaTeX-kjelda skal kvar \prop-linje rykkjast inn med TO ASCII-MELLOMROM PER HIERARKINIVÅ. Døme:
          \mainprop{1}{}{...}
            \prop{1.1}{d}{...}
              \prop{1.11}{t}{...}
                \prop{1.111}{t}{...}
          Innrykket skal alltid samsvare med den logiske djupna. Hovudproposisjonar brukar \mainprop og står utan innrykk.

          TRAKTATEN SKAL ABSORBERE DEI TIDLEGARE DELFUNDAMENTA UTAN Å BLI EIN HISTORIEBOK.

          Bruk følgjande tradisjonar berre som USYNLEGE STRESSTESTAR i analysen: C-K-teori, shape grammars, Simon og design som det kunstige, General Design Theory, FBS, Axiomatic Design, Hubka/Eder, design methods, Alexander sitt form-kontekst/misfit og mønsterspråk, morfologisk analyse, TRIZ, topologiske prosessmodellar, Cross, Schön, Polanyi, Sennett, Pye, Winograd/Flores, Krippendorff, Dorst, Nelson/Stolterman, Redström, Michl, Kubler, Gibson/Norman, Simondon, Ingold, designkybernetikk, Rittel/Webber, Findeli, Papanek, deltakande design, Value Sensitive Design, design justice, Bauhaus og Ulm.

          I ENDELEG TEKST:
          - Ikkje nemn desse namna eller teoriane berre for å vise lærdom.
          - Ikkje lån terminologien deira ukritisk.
          - Ikkje lag eit litteraturoversyn.
          - I staden skal traktatens eigne omgrep vere sterke nok til å plassere dei delvise sanningane dei peikar på.

          STRESSTEST MOT TIDLEGARE FUNDAMENT:
          Systemet skal, med eigne omgrep, kunne gjere greie for minst desse spørsmåla utan å skifte språk eller hente inn eit nytt apparat:
          - Korleis kan design opne moglegheiter som ikkje var spesifiserte på førehand?
          - Korleis kan former genererast, varierast, transformerast og gjenkjennast?
          - Korleis verkar krav og avgrensingar utan at dei åleine bestemmer løysinga?
          - Kva er forholdet mellom føremål, verknad, struktur og materiell realisering?
          - Korleis kan ei løysing endre sjølve problemforståinga?
          - Korleis verkar materiale og produksjon som meir enn etterfølgjande utføring?
          - Korleis kan taus, situert og handverksmessig kunnskap vere verkeleg utan å bli immun mot kritikk?
          - Korleis byggjer nye former på tidlegare former utan å vere bestemte av historia?
          - Korleis oppstår meining og handlingsmoglegheiter i forholdet mellom form, menneske og situasjon?
          - Korleis handterer design konflikt mellom fleire legitime omsyn som ikkje kan reduserast til eitt mål?
          - Korleis kan ein skilje mellom å forklare kvifor ei form vart til, å vurdere om ho er god, og å avgjere kven som har rett til å handheve vurderinga?
          - Korleis kan ansvar, skade og fordelingsverknader inngå utan å late som dei kan utleiast frå geometri?

          Dersom teorien berre kan svare på eit av desse spørsmåla ved å importere eit nytt eksternt rammeverk, er fundamentet enno ikkje ferdig. Reparer det med traktatens eigne distinksjonar.

          MEN IKKJE OVERLOV:
          Eit fundament treng ikkje utleie alle verdiar frå form. Det må derimot vise KVAR ulike slags påstandar høyrer heime og kva som kan og ikkje kan utleiast frå kva. Skil strengt mellom:
          - forklaring: kvifor noko vart eller kan bli slik,
          - vurdering: kvifor noko bør føretrekkjast,
          - autoritet: kven som legitimt kan gjere ei vurdering bindande.
          Ingen av desse tre får smuglast inn som om dei var det same.

          OPERATIVT KRAV:
          Fundamentet skal ikkje berre beskrive. Det skal kunne brukast til å:
          - beskrive form utan å redusere henne til namn på ting,
          - skilje moglege frå realiserte konfigurasjonar,
          - finne kva som faktisk er valt og kva som berre var gjeve,
          - generere nye designhypotesar ved å endre avgrensingar, relasjonar eller val,
          - samanlikne alternativ utan å late som alle verdiar er éin skala,
          - forklare kvifor ei form vart slik ho vart,
          - peike på kva forklaringa enno ikkje omfattar,
          - teste påstandar gjennom konsekvensar som kan observerast eller prøvast,
          - knyte form til materiale, produksjon, bruk, persepsjon, historie og situasjon utan å redusere form til nokon av dei,
          - vise grensene for kva teorien sjølv kan avgjere.

          Rekonstruer argumentets indre maskineri. Les heile kjeldeteksten som eitt system. Finn primitive omgrep, definisjonar, postulat, reelle teorem, observasjonar, illustrasjonar, overlapp, manglande mellomledd og motseiingar. Ikkje vis analysen.

          Du har lov til å flytte, slå saman, dele, skrive nye mellomledd, fjerne svake delar, endre klassifikasjon og nummerering, skjerpe definisjonar og rekonstruere heile rekkjefølgja. Ver lojal mot den sterkaste teorien latent i materialet, ikkje mot ordlyden.

          Hald systemet d = definisjon, a = postulat, t = teorem, o = observasjon, i = illustrasjon, men klassifiser strengt. Eit teorem må faktisk følgje frå tidlegare proposisjonar. Eit postulat er noko systemet treng men ikkje kan utleie. Ein observasjon er empirisk eller motiverande, ikkje logisk nødvendig. Ein definisjon fastset bruk. Ei illustrasjon er berre eit døme.

          For kvart teorem skal du internt kunne peike på dei konkrete tidlegare proposisjonane som gjer det gyldig. Dersom det berre er plausibelt, er det ikkje eit teorem. For kvart postulat skal det vere klart kvifor det ikkje blir smugla inn som konklusjon. For kvar definisjon skal seinare bruk vere konsekvent.

          SPRÅK:
          Kort, hardt, enkelt, nøkternt, presist. Ingen akademisk fyll. Ingen falsk mystikk. Ingen retoriske spørsmål. Ingen overgangsprosa som berre bind saman. Ingen setning skal stå berre fordi ho høyrest klok ut. Føretrekk vanlege ord. La nokre avgjerande proposisjonar vere svært korte; la andre få to eller tre setningar når utleiinga krev det.

          Ver særleg streng med omgrepa form, objekt, ting, konfigurasjon, mogleg, realisert, regel, avgrensing, val, relasjon, transformasjon, rom, materiale, funksjon, intensjon, forklaring, vurdering og ansvar. Ingen får vere diffuse.

          Test stille kvar proposisjon: Kva ville gjort henne falsk? Er ho analytisk, empirisk eller postulert? Følgjer ho frå det som står før? Treng systemet henne? Brukar ho omgrep som enno ikkje er etablerte? Kan ho seiast enklare? Er ho berre repetisjon? Opnar ho for faktisk undersøking eller formarbeid? Omskriv, flytt eller fjern alt som ikkje held.

          Bruk ekstra mykje arbeid på dei første 10–20 proposisjonane. Opninga må etablere nesten alt resten kan vekse frå. Ikkje aksepter eksisterande opning automatisk. Finn den sterkaste moglege første proposisjonen. Dei første proposisjonane skal vere så fundamentale at seinare delar kan peike tilbake på dei utan å innføre eit nytt metafysisk eller matematisk system undervegs.

          SLUTTEN:
          Verket må ikkje berre stoppe. Dei siste hovudproposisjonane skal vise grensene for systemet: kva teorien kan avgjere, kva ho berre kan strukturere, kva som må prøvast i materiale, handling, bruk eller samfunn, og kva ho ikkje kan avgjere åleine. Slutten skal kaste nytt lys bakover på starten.

          SISTE KONTROLLPASS, OBLIGATORISK:
          A. Les berre proposisjonane i nummerrekkjefølgje. Etter kvar proposisjon, lat som resten er skjult. Den NESTE må kunne forståast og forsvarast frå det som no er synleg. Om ikkje: reparer kjeda.
          B. Sjekk parent-child-forholdet for ALLE nummer. Ingen laus proposisjon får overleve.
          C. Søk etter alle symbol, likningar, variablar, formelle operatorar og tekniske ord. Fjern dei eller etabler dei fullstendig innanfrå teksten.
          D. Søk etter kvar plass teorien føreset C-K, shape grammar, FBS, systemteori, etikkteori, praksisteori eller andre eksterne apparat. Omskriv slik at poenget står i traktatens eigne omgrep.
          E. Stresstest mot lista over tidlegare delfundament. For kvar viktig innsikt dei dekkjer, må traktaten anten kunne plassere henne, vise at ho ligg utanfor formteorien, eller vise kvifor spørsmålet er feil stilt. Ingen taus restkategori.
          F. Fjern redundans, banalitetar, falske teorem, autoritetsmarkørar, namn-dropping og metaforar som svekkjer presisjonen.

          OUTPUTKRAV:
          Gi berre det fullstendige, ferdige traktatmanuskriptet. Ingen føreord. Ingen kommentar til endringane. Ingen analyse. Ingen samandrag. Ingen samanlikning med Wittgenstein eller andre teoriar. Ingen kjeldetilvisingar. Behald LaTeX-makroformatet: \mainprop{...}{...}{...} og \prop{...}{...}{...}. Lever heile teksten, ikkje eit utdrag. Hugs to ASCII-mellomrom per hierarkinivå framfor kvar \prop-linje.

          KJELDEMANUSKRIPT:
          PROMPT
          cat source.tex >> prompt.txt
      - name: Rewrite with GPT-6 Astra
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_MODEL: gpt-6-astra
          COPILOT_ALLOW_ALL: 'true'
        run: |
          set -o pipefail
          copilot --yolo -p "$(cat prompt.txt)" | tee astra-tractatus.tex
      - name: Upload rewritten tractatus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-tractatus
          path: astra-tractatus.tex
          if-no-files-found: error
