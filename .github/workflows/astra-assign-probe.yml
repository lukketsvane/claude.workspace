name: Direct Astra CLI probe
on:
  push:
    branches: [main]
permissions:
  contents: read
  copilot-requests: write
jobs:
  probe:
    if: contains(github.event.head_commit.message, 'Run direct GPT-6 Astra Copilot CLI probe')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Run GPT-6 Astra
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot -p "Reply with exactly ASTRA_OK and nothing else." --model gpt-6-astra --no-ask-user
