name: Astra assignment probe
on:
  push:
    branches: [main]
permissions:
  contents: read
  issues: write
jobs:
  assign:
    if: contains(github.event.head_commit.message, 'Retry Astra assignment probe')
    runs-on: ubuntu-latest
    steps:
      - name: Assign issue 6 to Copilot with GPT-6 Astra
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl --fail-with-body -sS -X POST
          -H "Accept: application/vnd.github+json"
          -H "X-GitHub-Api-Version: 2022-11-28"
          -H "Authorization: Bearer $GH_TOKEN"
          https://api.github.com/repos/lukketsvane/claude.workspace/issues/6/assignees
          -d '{"assignees":["copilot-swe-agent[bot]"],"agent_assignment":{"target_repo":"lukketsvane/claude.workspace","base_branch":"main","custom_instructions":"Use the requested model and complete only the issue task.","custom_agent":"","model":"gpt-6-astra"}}'
