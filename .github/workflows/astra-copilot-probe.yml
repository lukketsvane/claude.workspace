name: Astra Copilot Probe
on:
  push:
    paths:
      - '.github/workflows/astra-copilot-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  copilot-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Query GPT-6 Astra
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_MODEL: gpt-6-astra
          COPILOT_ALLOW_ALL: 'true'
        run: |
          set -o pipefail
          copilot --yolo -p 'Reply with exactly ASTRA_OK and nothing else.' | tee astra-result.txt
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-result
          path: astra-result.txt
          if-no-files-found: warn
