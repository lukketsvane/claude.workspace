name: Puter Astra browser probe
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    if: contains(github.event.head_commit.message, 'Run Puter GPT-6 Astra browser probe')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v7
      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Run browser probe
        run: |
          cat > probe.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext();
          const page = await context.newPage();
          page.on('console', m => console.log('PAGE_CONSOLE:', m.text()));
          page.on('popup', p => console.log('POPUP_OPENED:', p.url()));
          await page.goto('https://claude-workspace.iverfinne.no/astra-xpl.html', {waitUntil:'networkidle', timeout:60000});
          console.log('BRIDGE_LOADED');
          await page.getByRole('button', {name:'Create temp user + test GPT-6 Astra'}).click();
          const started = Date.now();
          let text = '';
          while(Date.now()-started < 120000){
            text = await page.locator('#out').innerText().catch(()=> '');
            if(text.includes('ASTRA_OK') || text.includes('ERROR:')) break;
            await page.waitForTimeout(1000);
          }
          console.log('VISIBLE_OUTPUT_BEGIN');
          console.log(text);
          console.log('VISIBLE_OUTPUT_END');
          console.log('OPEN_PAGES:', context.pages().map(p=>p.url()).join(' | '));
          await browser.close();
          if(!text.includes('ASTRA_OK')) process.exit(2);
          JS
          node probe.mjs
