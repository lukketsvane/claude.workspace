<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>block loops — specimen</title>
<style>
  :root {
    --ground: #f2f3f1;
    --ink: #1a1d1b;
    --muted: #6b726d;
    --hairline: #d6d9d5;
    --accent: #3e7a6c;
    --card: #f7f8f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #141715;
      --ink: #dde2de;
      --muted: #869088;
      --hairline: #2b302d;
      --accent: #6fae9c;
      --card: #191d1a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 14px;
    line-height: 1.5;
  }
  main { max-width: 880px; margin: 0 auto; padding: 48px 24px 96px; }
  header { margin-bottom: 40px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  header p { color: var(--muted); margin: 0; max-width: 60ch; }
  .hero {
    font-size: 32px;
    color: var(--accent);
    margin: 28px 0 0;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  .card {
    border: 1px solid var(--hairline);
    background: var(--card);
    padding: 20px 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    cursor: pointer;
  }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .stage {
    min-height: 96px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }
  .label { display: flex; justify-content: space-between; align-items: baseline; }
  .name { color: var(--accent); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; font-size: 11px; }
  .meta { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .snippet {
    color: var(--muted);
    font-size: 11px;
    border-top: 1px solid var(--hairline);
    padding-top: 10px;
    overflow-x: auto;
    white-space: nowrap;
  }
  .card.copied .snippet { color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1>block loops</h1>
    <p>Tiny looping animations drawn with Unicode block glyphs.
       They render in <code>currentColor</code>, weigh nothing, and close perfectly.
       Click a card to copy its tag.</p>
    <block-loop class="hero" name="wave"></block-loop>
  </header>
  <div class="grid" id="grid"></div>
</main>
<script type="module">
  import { LOOPS } from "./blocks.js";

  const grid = document.getElementById("grid");
  for (const name of Object.keys(LOOPS)) {
    const loop = LOOPS[name];
    const sample = loop.frame(0);
    const w = sample.split("\n")[0].length;
    const h = sample.split("\n").length;
    const tag = `<block-loop name="${name}"></block-loop>`;

    const card = document.createElement("button");
    card.className = "card";
    card.innerHTML = `
      <span class="stage"><block-loop name="${name}"></block-loop></span>
      <span class="label">
        <span class="name">${name}</span>
        <span class="meta">${w}×${h} · ${loop.fps} fps</span>
      </span>
      <span class="snippet"></span>`;
    card.querySelector(".snippet").textContent = tag;
    card.addEventListener("click", async () => {
      await navigator.clipboard.writeText(tag);
      card.classList.add("copied");
      setTimeout(() => card.classList.remove("copied"), 800);
    });
    grid.append(card);
  }
</script>
</body>
</html>
