<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>block loops — specimen</title>
<style>
  :root {
    --ground: #f2f3f1;
    --ink: #1a1d1b;
    --muted: #6b726d;
    --hairline: #d6d9d5;
    --accent: #3e7a6c;
    --card: #f7f8f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #141715;
      --ink: #dde2de;
      --muted: #869088;
      --hairline: #2b302d;
      --accent: #6fae9c;
      --card: #191d1a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 14px;
    line-height: 1.5;
  }
  main { max-width: 880px; margin: 0 auto; padding: 48px 24px 96px; }
  header { margin-bottom: 32px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  header p { color: var(--muted); margin: 0; max-width: 60ch; }
  .hero { display: block; margin: 28px 0 0; }
  h2 {
    font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted);
    margin: 40px 0 16px;
  }
  .bar { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 16px; }
  .bar h2 { margin: 40px 0 0; }
  .modes { display: flex; border: 1px solid var(--hairline); }
  .modes button {
    font: inherit; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    background: none; border: none; color: var(--muted);
    padding: 6px 14px; cursor: pointer;
  }
  .modes button + button { border-left: 1px solid var(--hairline); }
  .modes button[aria-pressed="true"] { background: var(--accent); color: var(--ground); }
  .modes button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  .card {
    border: 1px solid var(--hairline);
    background: var(--card);
    color: var(--ink);
    font: inherit;
    text-align: left;
    padding: 20px 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    cursor: pointer;
  }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .stage {
    min-height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--accent);
  }
  .label { display: flex; justify-content: space-between; align-items: baseline; }
  .name { color: var(--accent); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; font-size: 11px; }
  .meta { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .snippet {
    color: var(--muted);
    font-size: 11px;
    border-top: 1px solid var(--hairline);
    padding-top: 10px;
    overflow-x: auto;
    white-space: nowrap;
  }
  .card.copied .snippet { color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1>block loops</h1>
    <p>Tiny looping animations for iverfinne.no. The wooden set from klossete,
       plus abstract density loops rendered as voxels, pixels, or glyphs.
       Click a card to copy its tag.</p>
    <block-toys class="hero" name="rull" scale="0.75"></block-toys>
  </header>

  <div class="bar">
    <h2>klossane</h2>
    <div class="modes" role="group" aria-label="dimension" id="toymodes">
      <button data-mode="3d" aria-pressed="true">3d</button>
      <button data-mode="2d" aria-pressed="false">2d</button>
    </div>
  </div>
  <div class="grid" id="toys"></div>

  <div class="bar">
    <h2>fields</h2>
    <div class="modes" role="group" aria-label="renderer" id="fieldmodes">
      <button data-mode="3d" aria-pressed="true">3d</button>
      <button data-mode="2d" aria-pressed="false">2d</button>
      <button data-mode="glyph" aria-pressed="false">glyph</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</main>
<script type="module">
  import { LOOPS } from "./blocks.js";
  import "./blocks-gfx.js";
  import { TOYS } from "./toys.js";

  let mode = "3d";
  const fieldsGrid = document.getElementById("grid");

  // klossane cards, with their own 3d / 2d toggle
  let toyMode = "3d";
  const toyTag = (name) => toyMode === "2d"
    ? `<block-toys name="${name}" mode="2d"></block-toys>`
    : `<block-toys name="${name}"></block-toys>`;

  const toysGrid = document.getElementById("toys");
  const toyCards = [];
  for (const name of Object.keys(TOYS)) {
    const toy = TOYS[name];
    const card = document.createElement("button");
    card.className = "card";
    card.innerHTML = `
      <span class="stage"></span>
      <span class="label">
        <span class="name">${name}</span>
        <span class="meta">${toy.scene(0).length === 1 ? "1 piece" : toy.scene(0).length + " pieces"} · ${toy.dur}s</span>
      </span>
      <span class="snippet"></span>`;
    card.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(toyTag(name)); } catch {}
      card.classList.add("copied");
      setTimeout(() => card.classList.remove("copied"), 800);
    });
    toysGrid.append(card);
    toyCards.push({ name, card });
  }

  function renderToys() {
    for (const { name, card } of toyCards) {
      const el = document.createElement("block-toys");
      el.setAttribute("name", name);
      if (toyMode === "2d") el.setAttribute("mode", "2d");
      card.querySelector(".stage").replaceChildren(el);
      card.querySelector(".snippet").textContent = toyTag(name);
    }
    for (const b of document.querySelectorAll("#toymodes button")) {
      b.setAttribute("aria-pressed", String(b.dataset.mode === toyMode));
    }
  }
  for (const b of document.querySelectorAll("#toymodes button")) {
    b.addEventListener("click", () => { toyMode = b.dataset.mode; renderToys(); });
  }
  renderToys();

  const tagFor = (name) => mode === "glyph"
    ? `<block-loop name="${name}"></block-loop>`
    : `<block-gfx name="${name}" mode="${mode}"></block-gfx>`;

  const stageFor = (name) => {
    const el = document.createElement(mode === "glyph" ? "block-loop" : "block-gfx");
    el.setAttribute("name", name);
    if (mode !== "glyph") el.setAttribute("mode", mode);
    return el;
  };

  const cards = [];
  for (const name of Object.keys(LOOPS)) {
    const loop = LOOPS[name];
    const sample = loop.frame(0);
    const w = sample.split("\n")[0].length;
    const h = sample.split("\n").length;

    const card = document.createElement("button");
    card.className = "card";
    card.innerHTML = `
      <span class="stage"></span>
      <span class="label">
        <span class="name">${name}</span>
        <span class="meta">${w}×${h} · ${loop.fps} fps</span>
      </span>
      <span class="snippet"></span>`;
    card.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(tagFor(name)); } catch {}
      card.classList.add("copied");
      setTimeout(() => card.classList.remove("copied"), 800);
    });
    fieldsGrid.append(card);
    cards.push({ name, card });
  }

  function render() {
    for (const { name, card } of cards) {
      card.querySelector(".stage").replaceChildren(stageFor(name));
      card.querySelector(".snippet").textContent = tagFor(name);
    }
    for (const b of document.querySelectorAll("#fieldmodes button")) {
      b.setAttribute("aria-pressed", String(b.dataset.mode === mode));
    }
  }

  for (const b of document.querySelectorAll("#fieldmodes button")) {
    b.addEventListener("click", () => { mode = b.dataset.mode; render(); });
  }
  render();
</script>
</body>
</html>
